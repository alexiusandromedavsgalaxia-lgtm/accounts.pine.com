<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pine Cloud</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#17181b;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif}.nav{height:68px;background:#ffffffcc;backdrop-filter:blur(20px);border-bottom:1px solid #0000000d;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - 1120px)/2));position:sticky;top:0;z-index:4}.brand{font-size:20px;font-weight:750;letter-spacing:-.04em}.pill{background:#eef4ff;color:#3169d5;border-radius:99px;padding:8px 12px;font-size:12px;font-weight:600}.page{max-width:1120px;margin:auto;padding:55px 22px 90px}.hero{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:35px}.eyebrow{font-size:11px;letter-spacing:.13em;color:#777;font-weight:750}.hero h1{font-size:clamp(45px,7vw,78px);line-height:.96;letter-spacing:-.07em;margin:10px 0}.hero p{color:#70747c;max-width:590px;font-size:17px;line-height:1.5;margin:0}.cloud{width:150px;height:150px;border-radius:42px;background:linear-gradient(145deg,#fff,#e7ecff);box-shadow:0 25px 60px #506bd51c;display:grid;place-items:center;font-size:60px;flex:none}.account{background:#fff;border:1px solid #00000009;border-radius:24px;padding:18px 20px;display:flex;align-items:center;gap:13px;box-shadow:0 12px 40px #00000008}.avatar{width:45px;height:45px;border-radius:14px;background:#111;color:#fff;display:grid;place-items:center;font-weight:700}.account small{display:block;color:#777;margin-top:3px}.sync{margin-left:auto;color:#238548;font-size:12px}.sync i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34c759;margin-right:6px}.toolbar{display:flex;gap:10px;margin:30px 0 18px}.search,.select{height:46px;border:1px solid #d8d9de;background:#fff;border-radius:13px;padding:0 14px;outline:none}.search{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:21px;padding:18px;min-height:215px;box-shadow:0 10px 35px #00000008;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 50px #00000012}.head{display:flex;gap:11px;align-items:center}.icon{width:40px;height:40px;border-radius:12px;background:#f1f2f6;display:grid;place-items:center;font-size:19px}.key{font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kind{font-size:11px;color:#8b8d93;margin-top:3px}.preview{height:105px;background:#f5f5f7;border-radius:15px;margin-top:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#777}.preview img{width:100%;height:100%;object-fit:cover}.preview pre{white-space:pre-wrap;width:100%;padding:13px;margin:0;font:12px/1.45 ui-monospace,monospace;max-height:105px;overflow:hidden}.date{font-size:10px;color:#9699a0;margin-top:11px}.empty{grid-column:1/-1;text-align:center;background:#fff;border-radius:20px;padding:65px;color:#777}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.cloud{display:none}.hero{display:block}}@media(max-width:550px){.grid{grid-template-columns:1fr}.toolbar{flex-direction:column}.select{width:100%}.page{padding-top:38px}.hero h1{font-size:52px}.sync{margin-left:0}.account{flex-wrap:wrap}}</style></head><body><header class="nav"><div class="brand">Pine Cloud</div><div class="pill">Account Data</div></header><main class="page"><section class="hero"><div><div class="eyebrow">PINE CLOUD</div><h1>Tu información.<br>En la nube.</h1><p>Un espacio visual para consultar los datos que Pine sincroniza entre tus dispositivos.</p></div><div class="cloud">☁️</div></section><section class="account"><div class="avatar" id="avatar">P</div><div><b id="name">Cargando…</b><small id="email"></small></div><div class="sync"><i></i>Sincronizado</div></section><div class="toolbar"><input id="q" class="search" placeholder="Buscar en Pine Cloud…"><select id="f" class="select"><option value="all">Todos los datos</option><option value="photos">Fotos</option><option value="settings">Configuración</option><option value="devices">Dispositivos</option><option value="account">Cuenta</option><option value="other">Otros</option></select></div><section id="grid" class="grid"></section></main><script>let all=[],groups={};const esc=x=>String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");function cat(k){if(/photo|avatar|image|picture/i.test(k))return"photos";if(/setting|preference|config|theme|language/i.test(k))return"settings";if(/device|iphone|ipad|android/i.test(k))return"devices";if(/account|profile|name|email/i.test(k))return"account";return"other"}function icon(c){return c==="photos"?"🖼️":c==="settings"?"⚙️":c==="devices"?"📱":c==="account"?"👤":"✦"}function preview(d,c){let v=d.value;try{v=JSON.parse(v)}catch{}if(c==="photos"&&typeof v==="string"&&/^https?:\\/\\//.test(v))return'<img src="'+esc(v)+'">';if(c==="photos")return"🖼️";if(c==="devices")return"📱";if(c==="settings")return"⚙️";if(typeof v==="object")v=JSON.stringify(v,null,2);return'<pre>'+esc(v)+'</pre>'}function render(){let f=document.getElementById("f").value,q=document.getElementById("q").value.toLowerCase(),d=(f==="all"?all:(groups[f]||[])).filter(x=>(x.key+" "+x.value).toLowerCase().includes(q));document.getElementById("grid").innerHTML=d.length?d.map(x=>{let c=cat(x.key);return'<article class="card"><div class="head"><div class="icon">'+icon(c)+'</div><div><div class="key">'+esc(x.key)+'</div><div class="kind">'+c+'</div></div></div><div class="preview">'+preview(x,c)+'</div><div class="date">Actualizado · '+esc(new Date(x.updated_at).toLocaleString())+'</div></article>'}).join(""):'<div class="empty">No hay datos para mostrar.</div>'}async function load(){try{let h=location.hash.slice(1),r=await fetch("/device-data/api/me/data"+(h?"?user_id="+encodeURIComponent(h):"")),x=await r.json();if(!r.ok)throw Error(x.error||"No se pudieron cargar los datos");all=x.data||[];groups=x.groups||{};let n=x.user?.name||"Cuenta Pine";document.getElementById("name").textContent=n;document.getElementById("avatar").textContent=n[0]?.toUpperCase()||"P";document.getElementById("email").textContent=x.user?.email||"";render()}catch(e){document.getElementById("grid").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}document.getElementById("q").oninput=render;document.getElementById("f").onchange=render;load();</script></body></html>
